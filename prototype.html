<!DOCTYPE html>
<!--
  PROTOTYPE — Throwaway UI Prototype for Acodal.cz Refresh
  Plan: "Four radically different variants of the new Acodal.cz site, switchable via ?variant=A|B|C|D and the floating bottom bar."
-->
<html lang="cs" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A CO DÁL — UI Prototyp (Varianty A / B / C / D)</title>

  <!-- Google Fonts with full Czech latin-ext support -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Lora:ital,wght@0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS v4 Browser CDN for instant prototype execution -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style type="text/tailwindcss">
    @theme {
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-serif: 'Lora', Georgia, Cambria, serif;
      --font-editorial: 'Playfair Display', Georgia, serif;
      --font-grotesk: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.22s ease-out;
    }
  </style>
</head>
<body class="antialiased">
  <div id="prototype-root"></div>

  <script src="prototype-data.js"></script>
  <script src="prototype-app.js"></script>
</body>
</html>
